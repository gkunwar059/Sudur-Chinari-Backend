services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: sudur_backend_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sudur_chinari}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sudur_db_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sudur_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sudur_chinari}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Django Backend Application (DRF + Gunicorn)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sudur_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-secret-key-92837482}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:8000,http://127.0.0.1:8000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - DB_ENGINE=${DB_ENGINE:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-sudur_chinari}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sudur_db_password_change_me}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin123}
      - AUTO_SEED=${AUTO_SEED:-true}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - sqlite_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sudur_network

volumes:
  postgres_data:
  static_data:
  media_data:
  sqlite_data:

networks:
  sudur_network:
    name: ${DOCKER_NETWORK:-sudur_network}
    driver: bridge
